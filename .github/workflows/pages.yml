# Publishes site/ to GitHub Pages (custom domain from site/CNAME: radar.saralogy.com).
# Scraping does NOT run here: it runs on your own machine (`radar run`), and
# `radar publish` pushes the resulting site/data/radar.json, which triggers this deploy.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
