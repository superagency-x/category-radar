[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "category-radar"
version = "1.0.0"
description = "Central European category intelligence: price, positioning, competitive landscape and market needs from public shelf data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Berk Saraloglu" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "structlog>=24.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "alembic>=1.13.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "bandit>=1.7.0",
  "pip-audit>=2.7.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
radar = "category_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=category_radar --cov-report=html --cov-report=term-missing --cov-fail-under=60"
markers = [
  "integration: marks integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

