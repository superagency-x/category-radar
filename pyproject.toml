[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "category-radar"
version = "1.0.0"
description = "Central European category intelligence: price, positioning, competitive landscape and market needs from public shelf data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Berk Saraloglu" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
radar = "category_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
