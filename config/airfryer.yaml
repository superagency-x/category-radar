# Price tiers, as percentiles of each market's price distribution
price_tiers:
  - {name: Entry,         max_pct: 25}
  - {name: Mainstream,    max_pct: 60}
  - {name: Premium,       max_pct: 90}
  - {name: Super-premium, max_pct: 100}

# Positioning claims / features, detected in titles, spec lines and descriptions.
# Patterns are case-insensitive regexes, written in all four languages at once.
claims:
  dual_zone:      {label: "Dual zone / two baskets", pattern: "dual|doppel|duo|double|twin|2 ?x|dwie komory|dwa kosze|podwójn|dvě|2 koše|duplakosar|két kosar|kétkosaras|stack"}
  steam:          {label: "Steam cooking",           pattern: "steam|dampf|par[aąy]|pára|párou|gőz"}
  window:         {label: "Viewing window",          pattern: "sichtfenster|window|okien|okno|okénk|ablak|glas|glass|szkł|sklo|üveg|crispi"}
  app:            {label: "App / smart",             pattern: "\\bapp\\b|smart|wifi|wi-fi|connected|aplikac|alkalmaz"}
  grill:          {label: "Grill function",          pattern: "grill|gril"}
  xxl:            {label: "XXL family size",         pattern: "xxl|xl\\b|family|rodzin|rodin|családi|mega"}
  energy:         {label: "Energy saving",           pattern: "energ|spar|oszczęd|šetří|úspor|takarékos"}
  easy_clean:     {label: "Easy cleaning / dishwasher", pattern: "spülmaschin|dishwasher|zmywar|myčk|mosogatógép|easy clean|snadné čištění|łatwe czyszczenie|könnyen tisztít"}
  multi_function: {label: "Multi-cooker (n-in-1)",   pattern: "\\d ?in ?1|\\d-in-1|\\d ?w ?1|\\d v 1|\\d az 1|multi"}
  fast:           {label: "Speed claim",             pattern: "turbo|rapid|schnell|faster|rychlej|szybk|gyors|blaze"}
  pfas_free:      {label: "Non-toxic / PFAS-free coating", pattern: "pfas|ptfe-free|pfoa|keramik|ceramic|ceramiczn|keramick|kerámia|edelstahl|stainless"}

# Market-needs lexicon for review mining (positive and negative mentions are
# both "salience": the need matters to buyers).
needs:
  capacity:      {label: "Capacity for family meals", pattern: "groß|größe|kapazität|family|familie|pojemn|duż|rodzin|objem|velk|rodin|méret|nagy|család|xxl"}
  cleaning:      {label: "Easy to clean",             pattern: "reinig|sauber|putz|spülmaschin|czyszcz|myć|zmywar|čišt|myčk|tisztít|mosogat"}
  noise:         {label: "Quiet operation",           pattern: "laut|leise|geräusch|głośn|cich|hlasit|hluč|tich|hangos|halk|zaj"}
  crispiness:    {label: "Crispy results",            pattern: "knusprig|kross|chrupi|chrupk|křupav|ropogós|crisp"}
  speed:         {label: "Cooking speed",             pattern: "schnell|zeit|szybk|czas|rychl|čas|gyors|idő"}
  footprint:     {label: "Countertop footprint",      pattern: "platz|sperrig|klein|miejsc|zajmuje|místo|rozměr|hely|helyet"}
  smell:         {label: "Plastic smell / materials", pattern: "geruch|riecht|plastik|zapach|plastik|zápach|plast|szag|műanyag"}
  coating:       {label: "Coating durability / safety", pattern: "beschicht|teflon|antihaft|powłok|teflon|povrch|nepřilnav|bevonat|teflon"}
  controls:      {label: "Ease of use / controls",    pattern: "bedien|einfach|intuitiv|display|obsług|prost|łatw|ovládán|jednoduch|kezel|egyszerű"}
  energy:        {label: "Energy use",                pattern: "strom|energie|energ|prąd|spotřeb|áram"}
  value:         {label: "Value for money",           pattern: "preis-leistung|preis|günstig|cena|tani|cen|levn|ár|olcsó"}

# Review mining: how many top products per channel to open for reviews
reviews:
  top_n_products: 8
