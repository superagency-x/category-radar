# Category Radar: category definition
# One YAML file = one category. Copy this file to analyse another category
# (e.g. robot vacuums). Nothing category-specific lives in the Python code.

category:
  id: airfryer
  name: Air fryers
  base_currency: EUR

# Polite-scraping defaults (overridable per channel)
crawl:
  delay_seconds: 4          # pause between requests to the same host
  timeout_seconds: 30
  max_retries: 2
  respect_robots_txt: true
  user_agent: "CategoryRadar/1.0 (personal market-research project; contact: berksaraloglu@gmail.com)"
  fetcher: auto             # auto | http | browser  (auto = HTTP first, headless browser on block)

markets:
  DE: {name: Germany,        currency: EUR, language: de}
  AT: {name: Austria,        currency: EUR, language: de}
  CH: {name: Switzerland,    currency: CHF, language: de}
  PL: {name: Poland,         currency: PLN, language: pl}
  CZ: {name: Czechia,        currency: CZK, language: cs}
  HU: {name: Hungary,        currency: HUF, language: hu}

# One "shelf" per market: the dominant price-comparison engine (or the
# market-leading retailer where the comparison engine blocks automated access).
# All listing URLs are sorted by popularity, so list position = popularity rank.
# Pagination follows the page's own "next" link, up to max_pages.
channels:
  geizhals_de:
    market: DE
    adapter: geizhals
    type: price_comparison
    start_url: "https://geizhals.de/?cat=hfritteuse&xf=16101_Hei%C3%9Fluftfritteuse~16101_Doppel-Hei%C3%9Fluftfritteuse~16101_Glas-Hei%C3%9Fluftfritteuse&hloc=de&pagesize=100"
    max_pages: 1
  geizhals_at:
    market: AT
    adapter: geizhals
    type: price_comparison
    start_url: "https://geizhals.at/?cat=hfritteuse&xf=16101_Hei%C3%9Fluftfritteuse~16101_Doppel-Hei%C3%9Fluftfritteuse~16101_Glas-Hei%C3%9Fluftfritteuse&hloc=at&pagesize=100"
    max_pages: 1
  toppreise_ch:
    market: CH
    adapter: toppreise
    type: price_comparison
    start_url: "https://www.toppreise.ch/produktsuche/Haushalt-Kueche/Kuechengeraete/Friteusen/Heissluftfritteusen-c2816"
    max_pages: 3
  ceneo_pl:
    market: PL
    adapter: ceneo
    type: price_comparison
    start_url: "https://www.ceneo.pl/Frytkownice/Typ:Airfryer.htm"
    max_pages: 3
  alza_cz:
    market: CZ
    adapter: alza
    type: retailer        # heureka.cz sits behind a bot challenge; Alza is CZ's #1 e-tailer
    start_url: "https://www.alza.cz/nejprodavanejsi-nejlepsi-horkovzdusne-fritezy/18874040.htm"
    max_pages: 3
  arukereso_hu:
    market: HU
    adapter: arukereso
    type: price_comparison
    start_url: "https://www.arukereso.hu/olajsuto-c4109/"
    max_pages: 3
    # This category also contains classic oil fryers. A title with a keep keyword (hot-air)
    # is always kept; otherwise a title with an oil-fryer keyword is dropped.
    keep_keywords: "air ?fryer|airfryer|forróleveg|hot air|levegős|dual|duo|crispi|easy fry|turbo|blaze"
    exclude_keywords: "olajsüt|olajos|minifryer|fondue|deep ?fryer|filtra|\\bFF\\d{3,4}\\b"

# Brand dictionary: canonical name -> aliases (lower-case). Unknown brands
# fall back to the first word of the title.
